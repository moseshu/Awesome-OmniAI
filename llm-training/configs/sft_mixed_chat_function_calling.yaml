task_type: sft
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
model_family: qwen
data_path: data/mixed_sft_function_calling.jsonl
output_dir: outputs/qwen-mixed-sft-function-calling-lora
max_seq_length: 4096
label_masking_strategy: all_assistant
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
torch_dtype: bfloat16
attn_implementation: flash_attention_2
gradient_checkpointing: true
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
num_train_epochs: 3
learning_rate: 0.0002
logging_steps: 10
save_strategy: steps
save_steps: 500
save_total_limit: 3
save_only_model: false
report_to: tensorboard
